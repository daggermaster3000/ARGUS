name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The readers, the maths and the exports. None of these need napari or a
  # display, so this job installs the handful of libraries they do use and stays
  # quick enough to run on every push.
  checks:
    name: checks (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the non-GUI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "dask[array]" h5py tifffile imageio zarr pandas openpyxl python-pptx pillow matplotlib scipy

      - name: Build the sample data
        run: python tests/make_sample_data.py

      - name: Readers, measurements, Excel export
        run: python tests/test_readers.py

      - name: ROI statistics and CSV export
        run: python tests/test_intensity.py

      - name: GPU voxel budget and the volume cache
        run: python tests/test_rendering.py

      - name: Figure slides
        run: python tests/test_slides.py

      - name: Overview stitching and the locator slide
        run: python tests/test_overview.py

      # antspyx is deliberately not installed here: this also checks that the
      # engine degrades cleanly when the backend is absent, which is what most
      # people cloning this will have.
      - name: Atlas registration engine
        run: python tests/test_registration.py

      # cellpose is deliberately not installed here either, for the same reason:
      # the engine runs through a stub backend, so this checks the units, the
      # decimation and the object table without downloading model weights.
      - name: Segmentation engine
        run: python tests/test_segmentation.py

    env:
      # Windows runners default to cp1252, which cannot encode the µm and arrows
      # the checks print.
      PYTHONIOENCODING: utf-8

  # Proves the thing anyone cloning it will actually type. Separate job because
  # napari[all] pulls Qt and takes minutes.
  install:
    name: pip install . (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: The console script runs
        run: microscopy-viewer --version

      - name: The package imports without a display
        run: python -c "import microscopy_viewer; print(microscopy_viewer.__version__)"
